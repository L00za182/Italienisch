<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Impara l'italiano</title>

<!-- Vollbild auf dem iPhone, kein Zoom-Springen beim Tippen in Eingabefelder -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FBF7F1">
<meta name="description" content="Italienisch in 365 Tagen — offline, ohne Konto, mit Bildern und täglicher Wiederholung.">

<!-- Als App auf dem Home-Bildschirm -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Italiano">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="src/css/app.css">

<style>
  /* Nur für den Moment vor dem Start – danach ersetzt die App den Inhalt. */
  .boot {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; min-height: 70dvh; text-align: center; color: #6B6259;
  }
  .boot .flag {
    width: 62px; height: 62px; border-radius: 20px;
    background: linear-gradient(100deg, #1F7A4C 0 33%, #f4f1ec 33% 66%, #C0392B 66%);
    box-shadow: 0 8px 24px rgba(36,31,26,.14);
  }
  .boot h1 { font-family: ui-serif, Georgia, serif; font-size: 22px; margin: 0; color: #241F1A; }
  @media (prefers-color-scheme: dark) { .boot h1 { color: #F0EAE1; } }
  .boot code {
    display: block; margin-top: 10px; font-size: 13px; text-align: left;
    white-space: pre-wrap; word-break: break-word; max-width: 34em;
  }
</style>
</head>

<body>
  <div id="app" class="app">
    <div class="boot">
      <div class="flag"></div>
      <h1>Impara l'italiano</h1>
      <p>Einen Moment…</p>
    </div>
  </div>

  <nav id="tabbar" class="tabbar" aria-label="Hauptnavigation"></nav>

  <noscript>
    <div class="boot">
      <h1>JavaScript ist ausgeschaltet</h1>
      <p>Die App braucht JavaScript. Bitte in den Safari-Einstellungen einschalten.</p>
    </div>
  </noscript>

  <script type="module" src="src/js/app.js"></script>

  <script>
    /* Wenn die App nicht startet, soll der Bildschirm den echten Grund nennen –
       nicht bloß eine Vermutung. Dafür werden im Fehlerfall die wichtigsten
       Dateien einzeln nachgeladen und ihr Status angezeigt. */
    (function () {
      var shown = false;
      var esc = function (s) {
        return String(s === undefined || s === null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      };

      // Diese Dateien braucht die App zwingend.
      var PROBE = [
        'src/js/app.js',
        'src/js/views.js',
        'src/data/vocab-a1.js',
        'src/css/app.css',
        'manifest.webmanifest'
      ];

      function show(title, advice, detail) {
        var boot = document.querySelector('#app .boot');
        if (!boot) return;
        boot.innerHTML =
          '<div class="flag"></div>' +
          '<h1>' + esc(title) + '</h1>' +
          '<p>' + advice + '</p>' +
          (detail ? '<code>' + detail + '</code>' : '');
      }

      function diagnose(msg) {
        var base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');

        // Fall 1: per Doppelklick geöffnet – dann greift keine Modul-Ladung.
        if (location.protocol === 'file:') {
          show('Start nicht möglich',
            'Die Datei wurde direkt vom Datenträger geöffnet. Browser verbieten in ' +
            'diesem Fall das Laden der App-Module.<br><br>' +
            'Lade die App über eine Web-Adresse (GitHub&nbsp;Pages) oder starte lokal ' +
            '<b>node tools/serve.mjs</b>.',
            esc(msg));
          return;
        }

        // Fall 2: über das Netz geladen – nachsehen, was tatsächlich fehlt.
        var lines = [];
        var missing = [];
        var done = 0;

        PROBE.forEach(function (rel) {
          var url = base + rel;
          fetch(url, { cache: 'no-store' })
            .then(function (res) {
              var type = res.headers.get('content-type') || '?';
              lines.push((res.ok ? 'OK  ' : res.status + ' ') + rel +
                         (res.ok ? '  [' + type.split(';')[0] + ']' : ''));
              if (!res.ok) missing.push(rel);
            })
            .catch(function (e) {
              lines.push('--- ' + rel + '  (' + (e && e.message || 'nicht erreichbar') + ')');
              missing.push(rel);
            })
            .then(function () {
              if (++done < PROBE.length) return;
              lines.sort();
              var detail = esc('Adresse: ' + base + '\n\n' + lines.join('\n') + '\n\nMeldung: ' + msg);

              if (missing.length === PROBE.length) {
                show('Dateien nicht gefunden',
                  'Unter dieser Adresse liegt keine der App-Dateien. Wahrscheinlich ' +
                  'zeigt die Adresse auf den falschen Ordner, oder die Veröffentlichung ' +
                  'läuft noch.', detail);
              } else if (missing.length) {
                show('Es fehlen Dateien',
                  'Beim Hochladen sind Ordner verloren gegangen. Im Repository müssen ' +
                  '<b>index.html</b>, <b>sw.js</b>, <b>manifest.webmanifest</b> sowie die ' +
                  'kompletten Ordner <b>src/</b> und <b>icons/</b> liegen — mit allen ' +
                  'Unterordnern.<br><br>Fehlt: <b>' + esc(missing.join(', ')) + '</b>', detail);
              } else {
                show('Start nicht möglich',
                  'Alle Dateien sind da, aber die App bricht beim Start ab. ' +
                  'Die Meldung unten sagt, woran es liegt.', detail);
              }
            });
        });
      }

      function fail(msg) {
        if (shown) return;
        if (!document.querySelector('#app .boot')) return;   // App läuft bereits
        shown = true;
        show('Einen Moment…', 'Die Ursache wird gerade ermittelt.', '');
        diagnose(msg);
      }

      window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT') {
          fail('Modul ' + (e.target.getAttribute('src') || '?') + ' konnte nicht geladen werden.');
        } else if (e.message) {
          fail(e.message);
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        fail((e.reason && e.reason.message) || e.reason);
      });
      setTimeout(function () { fail('Zeitüberschreitung beim Laden.'); }, 8000);
    })();
  </script>
</body>
</html>
